# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng. Dùng khi thiếu thông tin bắt buộc (tên/handle, URL, ...) để gọi tool khác đúng, hoặc khi cần xác nhận yes/no trước một hành động ghi (ví dụ trước khi gọi send). KHÔNG tự đoán giá trị thay vì hỏi."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây của MỘT tài khoản Twitter/X cụ thể. Chỉ dùng khi đã biết rõ tên hoặc handle; nếu không rõ ai, gọi clarify trước thay vì đoán."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên Twitter/X theo TỪ KHÓA/chủ đề (không phải theo một tài khoản cụ thể)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề, không kèm từ như 'top/phổ biến'"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "'phổ biến/nổi bật/top' -> Top; mặc định Latest"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet (web search chung hoặc tin tức)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "CHỈ từ khóa chủ đề chính, ví dụ 'AI', 'robotics'. Không nhét 'tin tức'/'hôm nay'/'tuần này' vào đây"}
        topic: {type: string, enum: [general, news], default: "general", description: "Dùng 'news' khi hỏi tin tức/thời sự"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "'hôm nay'->day, 'tuần này'->week, 'tháng này'->month, 'năm nay'->year"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung một URL cụ thể đã biết. Chỉ dùng khi có URL thật trong hội thoại; không tự bịa/đoán URL — thiếu URL thì gọi clarify."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ, lấy đúng từ hội thoại"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  - name: hacker_news_search
    description: "Tìm story trên Hacker News qua HN Search API. CHỈ dùng khi người dùng yêu cầu rõ Hacker News hoặc HN làm nguồn. Nếu chỉ hỏi web/tin tức nói chung, dùng lookup; nếu hỏi Twitter/X, dùng timeline hoặc social_search. Tool chỉ đọc, không đăng bài/bình luận/bình chọn và không cần API key."
    parameters:
      type: object
      properties:
        query: {type: string, minLength: 1, description: "Từ khóa/chủ đề cần tìm trên Hacker News"}
        sort_by: {type: string, enum: [relevance, recent], default: "relevance", description: "relevance = phù hợp nhất; recent = mới nhất trước"}
        timeframe: {type: string, enum: [all, day, week, month, year], default: "all", description: "Giới hạn thời gian; all = không giới hạn"}
        max_results: {type: integer, minimum: 1, maximum: 10, default: 5, description: "Số story trả về (1-10)"}
      required: [query]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi văn bản lên kênh Telegram đã cấu hình. Đây là hành động ghi, cần xác nhận trước: chỉ gọi với confirmed=true SAU KHI đã hỏi clarify(response_type='yes_no') và người dùng đồng ý. Không dùng tool này để trả lời câu hỏi thông thường."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
